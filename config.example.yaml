# Run `tg-media-archiver configure` to enter credentials through hidden prompts.
api_id: 0
api_hash: ""
bot_token: ""

# `tg-media-archiver login` fills this with the signed-in user's numeric ID.
allowed_user_ids: []

save_path: downloads
file_path_prefix: [media_datetime]
file_name_prefix: [message_id, file_name]
file_name_prefix_split: "_"
date_format: "%Y_%m"

media_types: [photo, video, document]
file_formats:
  video: [all]
  document: [all]

max_download_task: 3
max_concurrent_transmissions: 2
start_timeout: 120
log_level: INFO

# Telegram-facing messages. TGA_LANGUAGE and TGA_MESSAGES_DIR override these.
# Optional overrides go in messages/<language>.yml beside config.yaml.
language: zh_CN
messages_dir: messages

# Telegram sessions use this proxy. Leave empty for a direct connection.
proxy: {}
# proxy:
#   scheme: http
#   hostname: proxy.example.com
#   port: 7890
#   username: ""
#   password: ""
