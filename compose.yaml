services:
  archiver:
    image: ghcr.io/carmjos/tg-media-archiver:1.0.0
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app
      - ./downloads:/app/downloads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
