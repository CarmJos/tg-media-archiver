services:
  archiver:
    build: .
    image: tg-media-archiver:local
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app
      - ./downloads:/app/downloads
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
