bot:
  help: |-
    🤖 Telegram Media Archiver
    /start, /help — Show help
    /progress — View the current queue (collapses after 10 seconds; tap the button to reopen)
    /progress off — Delete the progress message

    Forward photos, videos, or files in this private chat. Once saved or confirmed as a duplicate, the forwarded message is deleted for both sides.
  command_start: Show help
  command_help: Show help
  command_progress: View download progress
