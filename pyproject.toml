[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tg-media-archiver"
version = "1.2.0"
description = "A self-hosted Telegram bot that archives forwarded media to local or NAS storage, with SHA-256 deduplication, persistent download queues, and on-demand progress."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CarmJos"}]
keywords = [
  "telegram",
  "telegram-bot",
  "media-downloader",
  "media-archiver",
  "self-hosted",
  "deduplication",
  "python",
  "docker",
  "truenas",
  "sqlite",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Communications :: Chat",
]
dependencies = [
  "Pyrogram @ https://github.com/tangyoha/pyrogram/archive/51a100c5e2745471ee89c1dd96dd69962973108b.zip",
  "ruamel.yaml==0.19.1",
]

[project.optional-dependencies]
speed = ["PyTgCrypto==1.2.12"]

[project.scripts]
tg-media-archiver = "tg_media_archiver.cli:main"

[project.urls]
Homepage = "https://github.com/CarmJos/tg-media-archiver"
Repository = "https://github.com/CarmJos/tg-media-archiver"
Issues = "https://github.com/CarmJos/tg-media-archiver/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["tg_media_archiver*"]
namespaces = false

[tool.setuptools.package-data]
tg_media_archiver = ["config.example.yaml"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
