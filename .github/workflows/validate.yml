name: Validate

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel with encryption support
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'Expected one wheel, found {len(wheels)}')
          subprocess.run(
              [sys.executable, '-m', 'pip', 'install', str(wheels[0]) + '[speed]'],
              check=True,
          )
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Validate installed Python functionality
        run: python .github/scripts/validate.py

  validation:
    name: Python validation
    if: ${{ always() }}
    needs: python
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every Python version to pass
        env:
          VALIDATION_RESULT: ${{ needs.python.result }}
        run: test "$VALIDATION_RESULT" = success
